# API Contracts — Part 3: Diagrams, Users, Export/Import
# Merge with api-contracts-part1.yaml (components section) for a valid OpenAPI document.

paths:

  # ── DIAGRAM LAYOUTS ─────────────────────────────────────────────────────────
  /api/diagrams:
    get:
      summary: List saved diagram layouts
      operationId: listDiagrams
      tags: [Diagrams]
      responses:
        '200':
          description: Layout list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiagramLayoutSummary' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Save a diagram layout (Contributor+)
      operationId: saveDiagram
      tags: [Diagrams]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagramLayoutCreate' }
      responses:
        '201':
          description: Layout saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramLayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/diagrams/{diagram_id}:
    parameters:
      - { name: diagram_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get diagram layout by ID
      operationId: getDiagram
      tags: [Diagrams]
      responses:
        '200':
          description: Layout record with full Cytoscape JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagramLayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete diagram layout (Admin only)
      operationId: deleteDiagram
      tags: [Diagrams]
      responses:
        '204': { description: Layout deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── USERS ───────────────────────────────────────────────────────────────────
  /api/users:
    get:
      summary: List all users (Admin only)
      operationId: listUsers
      tags: [Users]
      parameters:
        - { name: page,  in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserResponse' } }
                  total: { type: integer }
                  page:  { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a user (Admin only)
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get user by ID (Admin only)
      operationId: getUser
      tags: [Users]
      responses:
        '200':
          description: User record (no password_hash)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update user (Admin only)
      operationId: updateUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      summary: Delete user (Admin only) — cannot delete own account
      operationId: deleteUser
      tags: [Users]
      responses:
        '204': { description: User deleted }
        '400':
          description: Cannot delete own account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── EXPORT ──────────────────────────────────────────────────────────────────
  /api/export/json:
    get:
      summary: Export full inventory as Hometower JSON (Reader+)
      operationId: exportJson
      tags: [Export]
      responses:
        '200':
          description: Full inventory export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── IMPORT ──────────────────────────────────────────────────────────────────
  /api/import/json:
    post:
      summary: Import inventory from Hometower JSON (Admin only)
      operationId: importJson
      tags: [Import]
      description: >
        Performs a merge import. Existing records with matching IDs are updated.
        New records (no matching ID) are inserted. No records are deleted.
        Returns a summary of created, updated, and skipped counts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryExport' }
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400':
          description: Invalid import format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

# ── SCHEMAS (extend Part 1 components) ─────────────────────────────────────────
components:
  schemas:

    DiagramLayoutCreate:
      type: object
      required: [name, cytoscape_json]
      properties:
        name:           { type: string, maxLength: 255 }
        cytoscape_json: { type: object, description: "Full cy.json() output" }

    DiagramLayoutSummary:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DiagramLayoutResponse:
      type: object
      required: [id, name, cytoscape_json, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string }
        cytoscape_json: { type: object }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }

    UserCreate:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, maxLength: 100 }
        email:    { type: string, format: email }
        password: { type: string, minLength: 8 }
        role:     { $ref: '#/components/schemas/Role' }

    UserUpdate:
      type: object
      properties:
        username:  { type: string, maxLength: 100 }
        email:     { type: string, format: email }
        password:  { type: string, minLength: 8 }
        role:      { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }

    UserResponse:
      type: object
      required: [id, username, email, role, is_active, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        username:   { type: string }
        email:      { type: string }
        role:       { $ref: '#/components/schemas/Role' }
        is_active:  { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      # NOTE: password_hash is NEVER included in any response

    InventoryExport:
      type: object
      required: [version, exported_at, devices, connections, locations, tags, custom_fields]
      properties:
        version:       { type: string, example: "1.0" }
        exported_at:   { type: string, format: date-time }
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeviceResponse' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionResponse' }
        locations:
          type: array
          items: { $ref: '#/components/schemas/LocationResponse' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/TagResponse' }
        custom_fields:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldResponse' }

    ImportResult:
      type: object
      required: [devices, connections, locations, tags, custom_fields]
      properties:
        devices:
          $ref: '#/components/schemas/ImportEntityResult'
        connections:
          $ref: '#/components/schemas/ImportEntityResult'
        locations:
          $ref: '#/components/schemas/ImportEntityResult'
        tags:
          $ref: '#/components/schemas/ImportEntityResult'
        custom_fields:
          $ref: '#/components/schemas/ImportEntityResult'

    ImportEntityResult:
      type: object
      required: [created, updated, skipped]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
